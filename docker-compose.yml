version: '3.8'

services:
  backend:
    build:
      context: ./gridsphere-backend
      dockerfile: Dockerfile
    container_name: gridsphere-backend
    restart: unless-stopped
    ports:
      - "9004:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_EXPIRES_IN_MINUTES=${JWT_EXPIRES_IN_MINUTES}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
    env_file:
      - .env   # optional – you can also pass variables directly

  frontend:
    build:
      context: ./gridsphere-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: gridsphere-frontend
    restart: unless-stopped
    ports:
      - "9005:80"